
name: Build GlobalExpress APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Add Android platform
        run: npx cordova platform add android@15.1.0

      - name: Apply GlobalExpress icon
        run: |
          find platforms/android/app/src/main/res -path "*/mipmap-*-v26/ic_launcher.xml" -delete
          find platforms/android/app/src/main/res -path "*/mipmap-*-v26/ic_launcher_round.xml" -delete
          cp res-icons/icon-mdpi.png platforms/android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp res-icons/icon-hdpi.png platforms/android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp res-icons/icon-xhdpi.png platforms/android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp res-icons/icon-xxhdpi.png platforms/android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp res-icons/icon-xxxhdpi.png platforms/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp res-icons/icon-mdpi.png platforms/android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp res-icons/icon-hdpi.png platforms/android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp res-icons/icon-xhdpi.png platforms/android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp res-icons/icon-xxhdpi.png platforms/android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp res-icons/icon-xxxhdpi.png platforms/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

      - name: Build APK
        run: npx cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GlobalExpress-debug-apk
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
