
name: Build GlobalExpress APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Apply GlobalExpress icon
        run: |
          cp res-icons/icon-mdpi.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp res-icons/icon-hdpi.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp res-icons/icon-xhdpi.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp res-icons/icon-xxhdpi.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp res-icons/icon-xxxhdpi.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GlobalExpress-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
